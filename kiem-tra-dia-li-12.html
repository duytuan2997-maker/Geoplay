<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Làm bài kiểm tra Địa lí 12 theo bộ câu hỏi ôn tập.">
    <title>Bài kiểm tra Địa lí 12</title>
    <link rel="stylesheet" href="street-view-quiz.css">
    <link rel="stylesheet" href="class12-quiz.css">
    <script src="quiz-data.js" defer></script>
    <script src="geo-coin-rewards.js" defer></script>
    <script src="kiem-tra-dia-li-12.js" defer></script>
</head>
<body>
    <header class="quiz-header">
        <a href="index.html#courses" class="back-link">← Quay lại bài học</a>
        <p class="eyebrow">LUYỆN TẬP ĐỊA LÍ 12</p>
        <h1 id="quiz-title">Bài kiểm tra</h1>
        <p id="quiz-description"></p>
    </header>

    <main class="quiz-main">
        <section id="quiz-unavailable" class="panel quiz-unavailable" role="status" hidden>
            Không tìm thấy đề kiểm tra. Hãy quay lại bài học và chọn một bài có đề.
        </section>

        <form id="quiz-form" class="panel class12-quiz-form" hidden>
            <div id="quiz-questions"></div>
            <button class="primary-button" type="submit">Nộp bài</button>
        </form>

        <section id="quiz-result" class="panel result-panel" aria-live="polite" hidden>
            <div class="setup-icon" aria-hidden="true">🏁</div>
            <p class="eyebrow">KẾT QUẢ</p>
            <h2>Hoàn thành bài kiểm tra</h2>
            <p id="quiz-score" class="final-score"></p>
            <p id="quiz-feedback" class="final-detail"></p>
            <p id="quiz-reward" class="quiz-reward" role="status" aria-live="polite"></p>
            <button id="retry-quiz" class="primary-button" type="button">Làm lại đề</button>
            <a href="index.html#courses" class="text-button result-link">Quay lại bài học</a>
        </section>
    </main>
</body>
</html>
